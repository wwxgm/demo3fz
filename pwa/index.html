<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="你好我需要这个" />
  <meta name="theme-color" content="#0B1F33" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>你好我需要这个</title>
  <style>
    :root {
      --bg: #0B1F33;
      --text: #F4F7FB;
      --muted: #9BB0C5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    .screen {
      min-height: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background:
        radial-gradient(120% 80% at 50% -10%, rgba(56, 120, 180, 0.35), transparent 55%),
        linear-gradient(180deg, #0B1F33 0%, #071521 100%);
    }
    h1 {
      font-size: clamp(28px, 8vw, 40px);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-align: center;
      line-height: 1.25;
    }
    p {
      margin-top: 16px;
      color: var(--muted);
      font-size: 15px;
      text-align: center;
      line-height: 1.6;
      max-width: 280px;
    }
    .hint {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: max(20px, env(safe-area-inset-bottom));
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      line-height: 1.5;
      display: none;
    }
    .hint.show { display: block; }
  </style>
</head>
<body>
  <main class="screen">
    <h1>你好我需要这个</h1>
    <p>已可在 iPhone 上全屏运行</p>
  </main>
  <div id="hint" class="hint">
    用 Safari 打开本页 → 点底部分享 →「添加到主屏幕」即可变成 App 图标
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    }
    var standalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    if (!standalone) {
      document.getElementById('hint').classList.add('show');
    }
  </script>
</body>
</html>
