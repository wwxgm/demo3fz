workflows:
  ios-ipa:
    name: iOS unsigned IPA (Expo) — 同 demo1 免费无签名方式
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 22.11.0
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "IphoneHello.xcworkspace"
        XCODE_SCHEME: "IphoneHello"
    scripts:
      - name: Install npm dependencies
        script: |
          npm ci || npm install
      - name: Expo prebuild (generate ios/)
        script: |
          npx expo prebuild --platform ios --non-interactive
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Set Info.plist
        script: |
          PLIST="$CM_BUILD_DIR/ios/$XCODE_SCHEME/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 你好我需要这个" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 你好我需要这个" "$PLIST" || true
      - name: Build unsigned iOS app
        script: |
          xcodebuild \
            -workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$CM_BUILD_DIR/build/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA
        script: |
          APP=$(find "$CM_BUILD_DIR/build/derived" -name "*.app" -type d | head -n 1)
          echo "Found app: $APP"
          test -n "$APP"
          OUT="$CM_BUILD_DIR/build/ios"
          mkdir -p "$OUT/Payload"
          rm -rf "$OUT/Payload/"* "$OUT/unsigned-iphone-hello.ipa"
          cp -R "$APP" "$OUT/Payload/"
          cd "$OUT"
          zip -qry unsigned-iphone-hello.ipa Payload
          ls -lh unsigned-iphone-hello.ipa
    artifacts:
      - build/ios/unsigned-iphone-hello.ipa
      - build/derived/**/*.app
      - /tmp/xcodebuild_logs/*.log
